<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Basketball Team Planner</title><style>
:root{--navy:#181D30;--sky:#A8CCFA;--orange:#F04C24;--white:#fff;--bg:#F5F8FD;--muted:#69768A}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;color:var(--navy)}header{position:relative;overflow:hidden;background:linear-gradient(125deg,#181D30,#303A56);color:white;padding:30px 20px 26px;border-radius:0 0 28px 28px}header:after{content:"";position:absolute;right:-38px;top:-52px;width:140px;height:220px;transform:rotate(28deg);background:linear-gradient(90deg,transparent 0 17%,#A8CCFA 17% 44%,#FFFFFF 44% 57%,#F04C24 57% 79%,transparent 79%);opacity:.95;pointer-events:none}header .tag{position:relative;z-index:1;font-size:11px;letter-spacing:2px;color:#A8CCFA}header h1{position:relative;z-index:1;margin:9px 0 4px;font-size:27px}header p{position:relative;z-index:1;margin:0;color:#D7E7FD;font-size:13px}.wrap{max-width:700px;margin:auto;padding:18px 15px 90px}.card{background:white;border-radius:20px;padding:19px;margin-bottom:16px;box-shadow:0 5px 24px #181D3012}h2{font-size:18px;margin:0 0 14px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.primary{background:var(--orange);color:white;border:0;padding:13px 17px;border-radius:13px;font-weight:800;cursor:pointer}.ghost{background:#edf3fa;border:0;color:var(--navy);border-radius:10px;padding:9px 13px;cursor:pointer}.week-item{border-left:4px solid var(--sky);background:#f5f8fc;padding:12px;border-radius:10px;margin:8px 0;cursor:pointer}.week-item strong{font-size:14px}.week-item small{display:block;color:var(--muted);margin-top:4px}.calendar-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.calendar-head h2{margin:0}.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.dow{text-align:center;color:#7b8798;font-size:12px;padding:8px 0}.day{border:1px solid #e9eef4;background:white;min-height:79px;border-radius:9px;padding:6px 3px;overflow:hidden}.day.other{opacity:.3}.day.today{border:2px solid var(--orange)}.num{font-size:12px;font-weight:750;margin-left:3px}.event{display:block;width:100%;border:0;text-align:left;border-radius:5px;font-size:10px;line-height:1.3;padding:4px 3px;margin-top:4px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.practice{background:#E4F1FF;color:#205A91}.friendly{background:#FFE7DE;color:#AF371A}.tournament{background:#fce0e4;color:#a32c40}.legend{display:flex;gap:12px;font-size:12px;margin:12px 0 0;flex-wrap:wrap}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}.empty{color:#8793a4;font-size:13px;padding:12px 0}.overlay{display:none;position:fixed;inset:0;background:#08192c88;z-index:10;align-items:end;justify-content:center}.overlay.open{display:flex}.sheet{background:white;width:100%;max-width:700px;max-height:90dvh;overflow:auto;border-radius:23px 23px 0 0;padding:22px 20px 34px}.sheet h2{margin:0 0 16px}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input,.field select{width:100%;border:1px solid #d8e1ed;border-radius:11px;padding:13px;font-size:16px;background:white;color:var(--navy)}.actions{display:flex;gap:8px;margin-top:20px}.actions>*{flex:1}.person{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eef1f5;padding:9px 0;font-size:14px}.person select{border:1px solid #dce4ed;border-radius:9px;padding:7px;background:white;color:var(--navy)}.stats{display:flex;gap:7px;flex-wrap:wrap;margin:15px 0}.stat{background:#f1f5f9;padding:8px 11px;border-radius:10px;font-size:12px;font-weight:700}.detail-line{font-size:14px;margin:9px 0}.sub{font-size:12px;color:var(--muted)}.roster{font-size:12px;line-height:1.8;color:#6b778a}button{font-family:inherit}button:active{transform:scale(.98)}@media(min-width:650px){.overlay{align-items:center}.sheet{border-radius:23px;max-height:85vh}.day{min-height:105px;padding:8px}.event{font-size:11px}}
</style></head><body><header><div style="max-width:700px;margin:auto"><div class="tag">BASKETBALL TEAM PLANNER</div><h1>🏀 우리 팀 스케줄</h1><p>함께 뛰는 날을 한눈에</p></div></header><main class="wrap"><section class="card"><div class="row"><h2>이번 주 스케줄</h2><button class="primary" onclick="openAdd()">＋ 스케줄 추가</button></div><div id="weekly"></div></section><section class="card"><div class="calendar-head"><button class="ghost" onclick="move(-1)">‹</button><h2 id="monthLabel"></h2><button class="ghost" onclick="move(1)">›</button></div><div class="grid" id="calendar"></div><div class="legend"><span><i class="dot" style="background:#A8CCFA"></i>연습</span><span><i class="dot" style="background:#F04C24"></i>교류전</span><span><i class="dot" style="background:#E05B68"></i>대회</span></div></section><section class="card"><h2>선수 명단 <span id="rosterCount"></span></h2><div class="roster" id="roster"></div></section><p class="sub" style="text-align:center">현재 버전은 이 기기에 저장됩니다. 팀원 간 실시간 공유는 서버 연결이 필요합니다.</p></main><div class="overlay" id="overlay" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div><script>
const names=['소연','은영','미강','영신','예진','지은','혜린','희원','순진','예림','석희','송지수','양지수','영인','하연','서라','김슬기','이슬기','영림','혜수','호정','미정','효선','한라봉','남희','진휘','Y','.'].filter(Boolean);const roster=[...names.filter(x=>x!=='Y'&&x!=='.').sort((a,b)=>a.localeCompare(b,'ko')),'Y','.'];const types={practice:'연습',friendly:'교류전',tournament:'대회'};let events=JSON.parse(localStorage.getItem('basketball_events_v1')||'[]');let view=new Date();view.setDate(1);const fmt=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const safe=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem('basketball_events_v1',JSON.stringify(events));render()}function move(n){view.setMonth(view.getMonth()+n);render()}function render(){document.getElementById('monthLabel').textContent=`${view.getFullYear()}년 ${view.getMonth()+1}월`;let first=new Date(view.getFullYear(),view.getMonth(),1),start=new Date(first);start.setDate(1-first.getDay());let html=['일','월','화','수','목','금','토'].map(x=>`<div class="dow">${x}</div>`).join('');for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let date=fmt(d),es=events.filter(e=>e.date===date).sort((a,b)=>a.time.localeCompare(b.time));html+=`<div class="day ${d.getMonth()!==view.getMonth()?'other':''} ${date===fmt(new Date())?'today':''}"><div class="num">${d.getDate()}</div>${es.slice(0,3).map(e=>`<button class="event ${e.type}" onclick="openDetail('${e.id}')">${safe(e.time)} ${types[e.type]}</button>`).join('')}${es.length>3?`<small>+${es.length-3}</small>`:''}</div>`}document.getElementById('calendar').innerHTML=html;let today=new Date(),sun=new Date(today);sun.setDate(today.getDate()-today.getDay());let end=new Date(sun);end.setDate(sun.getDate()+7);let upcoming=events.filter(e=>{let d=new Date(e.date+'T12:00:00');return d>=sun&&d<end}).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));document.getElementById('weekly').innerHTML=upcoming.length?upcoming.map(e=>`<div class="week-item" style="border-color:${e.type==='practice'?'#A8CCFA':e.type==='friendly'?'#F04C24':'#E05B68'}" onclick="openDetail('${e.id}')"><strong>${types[e.type]} · ${e.date.slice(5).replace('-','/')} ${safe(e.time)}</strong><small>📍 ${safe(e.place)}</small></div>`).join(''):'<div class="empty">이번 주 등록된 일정이 없어요.</div>';document.getElementById('rosterCount').textContent=`(${roster.length}명)`;document.getElementById('roster').textContent=roster.join(' · ')}function show(html){document.getElementById('sheet').innerHTML=html;document.getElementById('overlay').classList.add('open')}function closeSheet(){document.getElementById('overlay').classList.remove('open')}function openAdd(){show(`<div class="row"><h2>스케줄 추가</h2><button class="ghost" onclick="closeSheet()">닫기 ✕</button></div><form onsubmit="addEvent(event)"><div class="field"><label>일정 종류</label><select name="type"><option value="practice">연습</option><option value="friendly">교류전</option><option value="tournament">대회</option></select></div><div class="field"><label>날짜</label><input name="date" type="date" required value="${fmt(new Date())}"></div><div class="field"><label>시간</label><input name="time" type="time" required value="19:00"></div><div class="field"><label>장소</label><input name="place" placeholder="예: OO체육관" required maxlength="100"></div><div class="actions"><button class="primary" type="submit">일정 등록</button></div></form>`)}function addEvent(ev){ev.preventDefault();let f=new FormData(ev.target);events.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2),type:f.get('type'),date:f.get('date'),time:f.get('time'),place:f.get('place').trim(),attendance:{}});view=new Date(f.get('date')+'T12:00:00');view.setDate(1);save();closeSheet()}function openDetail(id){let e=events.find(x=>x.id===id);if(!e)return;let counts={attend:0,maybe:0,absent:0,none:0};roster.forEach(n=>counts[e.attendance?.[n]||'none']++);show(`<div class="row"><h2>🏀 ${types[e.type]} 상세</h2><button class="ghost" onclick="closeSheet()">닫기 ✕</button></div><div class="detail-line">📅 ${safe(e.date)} · ${safe(e.time)}</div><div class="detail-line">📍 ${safe(e.place)}</div><div class="stats"><span class="stat">🟢 참석 ${counts.attend}</span><span class="stat">🟡 미정 ${counts.maybe}</span><span class="stat">🔴 불참 ${counts.absent}</span><span class="stat">⚪ 미응답 ${counts.none}</span></div><h2 style="margin-top:20px">선수별 참석 여부</h2><p class="sub">본인 이름을 찾아 참석 상태를 선택하세요.</p>${roster.map(n=>`<div class="person"><strong>${safe(n)}</strong><select onchange="setAttendance('${e.id}',${JSON.stringify(n)},this.value)"><option value="none" ${!e.attendance?.[n]||e.attendance[n]==='none'?'selected':''}>미응답</option><option value="attend" ${e.attendance?.[n]==='attend'?'selected':''}>🟢 참석</option><option value="maybe" ${e.attendance?.[n]==='maybe'?'selected':''}>🟡 미정</option><option value="absent" ${e.attendance?.[n]==='absent'?'selected':''}>🔴 불참</option></select></div>`).join('')}<div class="actions"><button class="ghost" onclick="deleteEvent('${e.id}')">일정 삭제</button><button class="primary" onclick="closeSheet()">완료</button></div>`)}function setAttendance(id,name,value){let e=events.find(x=>x.id===id);if(!e)return;e.attendance=e.attendance||{};e.attendance[name]=value;save();openDetail(id)}function deleteEvent(id){if(confirm('이 일정을 삭제할까요?')){events=events.filter(e=>e.id!==id);save();closeSheet()}}render();</script></body></html>
